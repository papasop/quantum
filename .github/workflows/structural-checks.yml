name: structural-checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify hashes and Python syntax
        run: python tools/verify_release.py
      - name: Quick Stim/PyMatching smoke test
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: python src/ft_unit_change_time_rotated_surface_code_v0_6_0.py --quick --output /tmp/quantum-smoke
